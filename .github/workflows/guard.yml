name: 发版形态守卫

# 完整历史用于校验配置的上游基线、线性后续提交和贡献者作者。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0：要数提交数、要找 root，浅克隆数不出来
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 历史、贡献者与本地发布资料
        run: |
          echo "提交数: $(git rev-list --count HEAD)"
          git log --format='  %h | %an | %s' | head -20
          python tools/release_guard.py --offline --no-collect
